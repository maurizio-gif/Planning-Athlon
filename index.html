<style>
@font-face {
  font-family: "Tusker Grotesk";
  src: url("fonts/TuskerGrotesk-5600Semibold.ttf") format("truetype");
  font-weight: 600;
  font-style: normal;
}
@font-face {
  font-family: "Tusker Grotesk";
  src: url("fonts/TuskerGrotesk-5700Bold.ttf") format("truetype");
  font-weight: 700;
  font-style: normal;
}
:root {
  --accent: #ff5701;
  --black: #111111;
  --bg: #f4f0eb;
  --border: #e0dbd3;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; }
body {
  font-family: 'Tusker Grotesk', sans-serif;
  background: var(--bg);
  color: var(--black);
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
.header {
  padding: 16px 20px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--black);
  border-bottom: 1px solid #1e1e1e;
  flex-shrink: 0;
}
.logo-img { height: 38px; width: auto; display: block; }
.header-label {
  font-size: 10px; font-weight: 900; letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--accent); text-align: right;
}

/* ── Hero strip ── */
.hero-strip {
  padding: 18px 20px 14px;
  flex-shrink: 0;
}
.hero-title {
  font-size: clamp(32px, 8vw, 56px); font-weight: 900; letter-spacing: 2px;
  text-transform: uppercase; line-height: 1.25; color: var(--black);
}
.hero-title span { color: var(--accent); }
.hero-sub {
  font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  color: #666; margin-top: 10px;
}

/* ── Cards container ── */
.cards {
  flex-shrink: 0;
  padding: 0 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ── Schedule card ── */
.sched-card {
  display: block;
  text-decoration: none;
  background: #fff;
  border-radius: 14px;
  border: 1px solid var(--border);
  padding: 22px 22px 20px;
  transition: background .15s, transform .1s, border-color .15s;
  position: relative;
  overflow: hidden;
}
.sched-card:hover { background: #faf7f3; border-color: #ccc5bc; }
.sched-card:active { transform: scale(0.98); }

/* accent bar on left */
.sched-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 5px;
  border-radius: 14px 0 0 14px;
  background: var(--accent);
}

/* Arrow icon */
.sched-card::after {
  content: '→';
  position: absolute;
  right: 22px; top: 50%;
  transform: translateY(-50%);
  font-size: 24px; font-weight: 900;
  color: #bbb;
  transition: color .15s, right .15s;
}
.sched-card:hover::after { color: var(--accent); right: 18px; }

.card-title {
  font-size: clamp(24px, 6vw, 32px); font-weight: 900; letter-spacing: 2px;
  text-transform: uppercase; color: var(--black); line-height: 1;
  padding-right: 40px;
}
.card-sub {
  font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  color: #888; margin-top: 5px;
}

.sched-card.card-agosto::before { background: #1a72d4; }
.sched-card.card-settembre::before { background: #8a3fd1; }

/* ── Responsive compaction (tablet/desktop) ── */
@media (min-width: 600px) {
  .hero-strip { padding: 18px 20px 14px; }
  .cards { gap: 14px; padding: 0 16px 14px; }
  .sched-card { padding: 26px 22px 24px; }
  .website-btn-wrap { padding: 0 16px 12px; }
  footer { padding: 10px 16px; }
}
@media (min-width: 1024px) {
  .hero-strip { padding: 8px 20px 6px; }
  .hero-title { font-size: clamp(28px, 4vw, 48px); }
  .cards { gap: 8px; padding: 0 16px 8px; }
  .sched-card { padding: 12px 22px 10px; }
  .card-title { font-size: clamp(20px, 3vw, 30px); }
  .website-btn-wrap { padding: 0 16px 8px; }
  footer { padding: 6px 16px; }
}

/* ── Website button ── */
.website-btn-wrap {
  padding: 0 16px 16px;
  flex-shrink: 0;
}
.website-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 18px 20px;
  background: transparent;
  border: 2px solid var(--border);
  border-radius: 14px;
  text-decoration: none;
  font-family: 'Tusker Grotesk', sans-serif;
  font-size: 16px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
  color: #888;
  transition: border-color .15s, color .15s, background .15s;
}
.website-btn:hover { border-color: var(--accent); color: var(--black); background: #ede9e3; }
.website-btn:active { background: #e5e0da; transform: scale(0.98); }
.website-btn-icon { font-size: 18px; }

/* ── Carousel ── */
.carousel-section {
  flex: 1;
  min-height: 100px;
  background: var(--bg);
  position: relative;
  overflow: hidden;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: stretch;
}
.carousel-wrap {
  overflow: hidden;
  position: relative;
}
/* Fade bordi */
.carousel-wrap::before,
.carousel-wrap::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 70px;
  z-index: 2;
  pointer-events: none;
}
.carousel-wrap::before { left: 0; background: linear-gradient(to right, var(--bg), transparent); }
.carousel-wrap::after  { right: 0; background: linear-gradient(to left, var(--bg), transparent); }
.carousel-track {
  display: flex;
  gap: 8px;
  width: max-content;
  animation: carousel-scroll 45s linear infinite;
  padding: 0 4px;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
}
.carousel-track.is-dragging { cursor: grabbing; }
.carousel-track.is-paused { cursor: zoom-in; }
@keyframes carousel-scroll {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
/* Tablet default */
.carousel-slide {
  flex-shrink: 0;
  width: 220px;
  aspect-ratio: 3 / 2;
  border-radius: 5px;
  overflow: hidden;
  border: 1px solid rgba(255,87,1,0.3);
  box-shadow: 0 0 14px rgba(255,87,1,0.12), inset 0 0 0 1px rgba(255,255,255,0.04);
}
.carousel-slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 30%;
  display: block;
  filter: brightness(0.88) contrast(1.08) saturate(0.95);
  transition: filter 0.4s;
  pointer-events: none;
  -webkit-user-drag: none;
}
.carousel-slide:hover img { filter: brightness(1.05) contrast(1.05) saturate(1.1); }

/* ── Lightbox ── */
.lightbox {
  display: none;
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.92);
  align-items: center; justify-content: center;
  animation: lb-in .2s ease;
}
.lightbox.open { display: flex; }
@keyframes lb-in { from { opacity: 0; } to { opacity: 1; } }
.lightbox img {
  max-width: 94vw; max-height: 88vh;
  object-fit: contain;
  border-radius: 6px;
  box-shadow: 0 0 60px rgba(255,87,1,0.25);
  animation: lb-zoom .25s cubic-bezier(.2,.8,.3,1);
}
@keyframes lb-zoom { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.lightbox-close {
  position: absolute; top: 18px; right: 18px;
  background: var(--accent); border: none; cursor: pointer;
  color: #fff; font-family: 'Tusker Grotesk', sans-serif;
  font-size: 14px; font-weight: 700; letter-spacing: 1.5px;
  padding: 8px 18px; border-radius: 20px;
  text-transform: uppercase;
}

/* ── Footer ── */
footer {
  background: var(--black);
  color: #666;

  text-align: center; line-height: 1.8;
  flex-shrink: 0;
}
footer strong { color: var(--accent); }

/* ── Mobile: slideshow grande, pulsanti compatti ── */
@media (max-width: 599px) {

  .card-title { font-size: 22px; letter-spacing: 1.5px; }

  .website-btn-wrap { padding: 0 14px 10px; }
  .website-btn { padding: 12px 16px; font-size: 13px; }
  footer { padding: 6px 16px; font-size: 9px; }
}

/* ── Carousel slide widths (must be last to override default) ── */

/* ── Totem / schermi portrait alti (es. 1080×1920) ── */

  .carousel-slide { width: min(88vw, 920px); }
}
</style>

<script>
/* ── Lightbox ── */
function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightbox-img').src = src;
  lb.classList.add('open');
}
function closeLightbox() {
  const lb = document.getElementById('lightbox');
  lb.classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.getElementById('lightbox').addEventListener('click', function(e) {
  if (e.target === this) closeLightbox();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

/* ── Carousel drag + pause ── */
(function () {
  const track = document.querySelector('.carousel-track');
  const DURATION = 45; // seconds

  let isPaused = false;
  let isDragging = false;
  let hasMoved = false;
  let dragStartX = 0;
  let dragBaseX = 0;

  function getTranslateX() {
    return new DOMMatrix(getComputedStyle(track).transform).m41;
  }

  function getHalfWidth() {
    return track.scrollWidth / 2;
  }

  function normalizeX(x) {
    const hw = getHalfWidth();
    let nx = x % hw;          // keep fractional part
    if (nx > 0) nx -= hw;     // ensure ≤ 0
    if (nx < -hw) nx += hw;   // ensure ≥ -hw
    return nx;
  }

  function resumeFromX(x) {
    const hw = getHalfWidth();
    const nx = normalizeX(x);
    const progress = Math.abs(nx) / hw;          // 0…1
    const delay = -(progress * DURATION).toFixed(4);
    track.style.transform = '';
    track.style.animation = `carousel-scroll ${DURATION}s linear ${delay}s infinite`;
    track.classList.remove('is-paused');
  }

  function pause() {
    const x = getTranslateX();
    track.style.animation = 'none';
    track.style.transform = `translateX(${x}px)`;
    isPaused = true;
    track.classList.add('is-paused');
  }

  /* click/tap = toggle pause (only if no drag occurred) */
  track.addEventListener('click', () => {
    if (hasMoved) return;
    if (isPaused) { resumeFromX(getTranslateX()); isPaused = false; }
    else          { pause(); }
  });

  /* drag start */
  function onStart(e) {
    hasMoved = false;
    isDragging = true;
    dragStartX = e.touches ? e.touches[0].clientX : e.clientX;
    dragBaseX = getTranslateX();
    track.style.animation = 'none';
    track.style.transform = `translateX(${dragBaseX}px)`;
    track.classList.add('is-dragging');
    track.classList.remove('is-paused');
  }

  /* drag move */
  function onMove(e) {
    if (!isDragging) return;
    if (e.touches) e.preventDefault();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const delta = cx - dragStartX;
    if (Math.abs(delta) > 4) hasMoved = true;
    const hw = getHalfWidth();
    let nx = dragBaseX + delta;
    if (nx > 0)    nx -= hw;
    if (nx < -hw)  nx += hw;
    track.style.transform = `translateX(${nx}px)`;
  }

  /* drag end */
  function onEnd() {
    if (!isDragging) return;
    isDragging = false;
    track.classList.remove('is-dragging');
    if (!isPaused) resumeFromX(getTranslateX());
    else { track.classList.add('is-paused'); }
  }

  track.addEventListener('mousedown',  onStart);
  track.addEventListener('touchstart', onStart, { passive: true });
  document.addEventListener('mousemove',  onMove);
  document.addEventListener('touchmove',  onMove, { passive: false });
  document.addEventListener('mouseup',  onEnd);
  document.addEventListener('touchend', onEnd);

  /* click on slide image → lightbox (only when not dragging) */
  track.querySelectorAll('.carousel-slide').forEach(slide => {
    slide.addEventListener('click', () => {
      if (hasMoved) return;
      openLightbox(slide.querySelector('img').src);
    });
  });
})();
</script>
