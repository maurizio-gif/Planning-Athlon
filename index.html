<style>
:root {
  --accent: #ff5701;
  --black: #111111;
  --bg: #f4f0eb;
  --border: #e0dbd3;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; }
body {
  font-family: 'Barlow Condensed', sans-serif;
  background: var(--black);
  color: #fff;
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
.header {
  padding: 16px 20px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #1e1e1e;
  flex-shrink: 0;
}
.logo-img { height: 38px; width: auto; display: block; }
.header-label {
  font-size: 10px; font-weight: 900; letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--accent); text-align: right;
}

/* ── Hero strip ── */
.hero-strip {
  padding: 28px 20px 20px;
  flex-shrink: 0;
}
.hero-title {
  font-size: clamp(32px, 8vw, 56px); font-weight: 900; letter-spacing: 2px;
  text-transform: uppercase; line-height: 0.95; color: #fff;
}
.hero-title span { color: var(--accent); }
.hero-sub {
  font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  color: #fff; margin-top: 10px;
}

/* ── Cards container ── */
.cards {
  flex: 1;
  padding: 0 16px 32px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.cards::-webkit-scrollbar { display: none; }

/* ── Schedule card ── */
.sched-card {
  display: block;
  text-decoration: none;
  background: #181818;
  border-radius: 14px;
  border: 1px solid #242424;
  padding: 22px 22px 20px;
  transition: background .15s, transform .1s, border-color .15s;
  position: relative;
  overflow: hidden;
}
.sched-card:hover { background: #1e1e1e; border-color: #333; }
.sched-card:active { transform: scale(0.98); }

/* accent bar on left */
.sched-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 5px;
  border-radius: 14px 0 0 14px;
  background: var(--accent);
}

/* Arrow icon */
.sched-card::after {
  content: '→';
  position: absolute;
  right: 22px; top: 50%;
  transform: translateY(-50%);
  font-size: 24px; font-weight: 900;
  color: #333;
  transition: color .15s, right .15s;
}
.sched-card:hover::after { color: var(--accent); right: 18px; }

.card-title {
  font-size: clamp(24px, 6vw, 32px); font-weight: 900; letter-spacing: 2px;
  text-transform: uppercase; color: #fff; line-height: 1;
  padding-right: 40px;
}
.card-sub {
  font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  color: #fff; margin-top: 5px;
}

.sched-card.card-giugno::before { background: #27a844; }
.sched-card.card-luglio::before { background: var(--accent); }
.sched-card.card-agosto::before { background: #1a72d4; }

/* ── Website button ── */
.website-btn-wrap {
  padding: 0 16px 16px;
  flex-shrink: 0;
}
.website-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 18px 20px;
  background: transparent;
  border: 2px solid #2a2a2a;
  border-radius: 14px;
  text-decoration: none;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
  color: #aaa;
  transition: border-color .15s, color .15s, background .15s;
}
.website-btn:hover { border-color: var(--accent); color: #fff; background: #1a1a1a; }
.website-btn:active { background: #1e1e1e; transform: scale(0.98); }
.website-btn-icon { font-size: 18px; }

/* ── Footer ── */
footer {
  background: #0a0a0a;
  color: #333;
  padding: 12px 16px;
  font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
  text-align: center; line-height: 1.8;
  flex-shrink: 0;
}
footer strong { color: var(--accent); }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <img src="https://www.athlonroma.it/wp-content/uploads/2025/08/Logo-oriz-full-2.png" alt="Athlon Club" class="logo-img">
</div>

<!-- Hero -->
<div class="hero-strip">
  <div class="hero-title">Orari<br><span>&amp; Corsi</span></div>
  <div class="hero-sub">Prenotazione obbligatoria</div>
</div>

<!-- Menu cards -->
<div class="cards">

  <a class="sched-card card-giugno" href="giugno.html">
    <div class="card-title">Giugno 2026</div>
    <div class="card-sub">Orario Ordinario</div>
  </a>

  <a class="sched-card card-luglio" href="luglio.html">
    <div class="card-title">Luglio 2026</div>
    <div class="card-sub">Orario Estivo</div>
  </a>

  <a class="sched-card card-agosto" href="agosto.html">
    <div class="card-title">Agosto 2026</div>
    <div class="card-sub">Orario Estivo</div>
  </a>

</div>

<div class="website-btn-wrap">
  <a class="website-btn" href="https://www.athlonroma.it" target="_blank" rel="noopener">
    <span class="website-btn-icon">🌐</span>
    Torna al sito web
  </a>
</div>

<footer>
  <strong>Athlon Club</strong> · Via Ugo Ojetti 134, 00137 Roma<br>
  Per Assistenza <a href="https://wiki.athlonroma.it" target="_blank" style="color:var(--accent);text-decoration:none;font-weight:800;">Clicca qui</a>
</footer>

</body>
</html>
