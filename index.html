<style>
@font-face {
  font-family: "Tusker Grotesk";
  src: url("fonts/TuskerGrotesk-5600Semibold.ttf") format("truetype");
  font-weight: 600;
  font-style: normal;
}
@font-face {
  font-family: "Tusker Grotesk";
  src: url("fonts/TuskerGrotesk-5700Bold.ttf") format("truetype");
  font-weight: 700;
  font-style: normal;
}
:root {
  --accent: #ff5701;
  --black: #111111;
  --bg: #f4f0eb;
  --border: #e0dbd3;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; }
body {
  font-family: 'Tusker Grotesk', sans-serif;
  background: var(--bg);
  color: var(--black);
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
.header {
  padding: 16px 20px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--black);
  border-bottom: 1px solid #1e1e1e;
  flex-shrink: 0;
}
.logo-img { height: 38px; width: auto; display: block; }
.header-label {
  font-size: 10px; font-weight: 900; letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--accent); text-align: right;
}

/* ── Hero strip ── */
.hero-strip {
  padding: 18px 20px 14px;
  flex-shrink: 0;
}
.hero-title {
  font-size: clamp(32px, 8vw, 56px); font-weight: 900; letter-spacing: 2px;
  text-transform: uppercase; line-height: 1.25; color: var(--black);
}
.hero-title span { color: var(--accent); }
.hero-sub {
  font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  color: #666; margin-top: 10px;
}

/* ── Cards container ── */
.cards {
  flex: 1;
  padding: 0 16px 32px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.cards::-webkit-scrollbar { display: none; }

/* ── Schedule card ── */
.sched-card {
  display: block;
  text-decoration: none;
  background: #fff;
  border-radius: 14px;
  border: 1px solid var(--border);
  padding: 22px 22px 20px;
  transition: background .15s, transform .1s, border-color .15s;
  position: relative;
  overflow: hidden;
}
.sched-card:hover { background: #faf7f3; border-color: #ccc5bc; }
.sched-card:active { transform: scale(0.98); }

/* accent bar on left */
.sched-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 5px;
  border-radius: 14px 0 0 14px;
  background: var(--accent);
}

/* Arrow icon */
.sched-card::after {
  content: '→';
  position: absolute;
  right: 22px; top: 50%;
  transform: translateY(-50%);
  font-size: 24px; font-weight: 900;
  color: #bbb;
  transition: color .15s, right .15s;
}
.sched-card:hover::after { color: var(--accent); right: 18px; }

.card-title {
  font-size: clamp(24px, 6vw, 32px); font-weight: 900; letter-spacing: 2px;
  text-transform: uppercase; color: var(--black); line-height: 1;
  padding-right: 40px;
}
.card-sub {
  font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  color: #888; margin-top: 5px;
}

.sched-card.card-giugno::before { background: #27a844; }
.sched-card.card-luglio::before { background: var(--accent); }
.sched-card.card-agosto::before { background: #1a72d4; }

/* ── Website button ── */
.website-btn-wrap {
  padding: 0 16px 16px;
  flex-shrink: 0;
}
.website-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 18px 20px;
  background: transparent;
  border: 2px solid var(--border);
  border-radius: 14px;
  text-decoration: none;
  font-family: 'Tusker Grotesk', sans-serif;
  font-size: 16px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
  color: #888;
  transition: border-color .15s, color .15s, background .15s;
}
.website-btn:hover { border-color: var(--accent); color: var(--black); background: #ede9e3; }
.website-btn:active { background: #e5e0da; transform: scale(0.98); }
.website-btn-icon { font-size: 18px; }

/* ── Carousel ── */
.carousel-section {
  flex-shrink: 0;
  background: var(--bg);
  padding: 10px 0;
  position: relative;
  overflow: hidden;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
/* Scanline animata */
.carousel-section::before {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  left: -20%;
  width: 80px;
  background: linear-gradient(to right, transparent, rgba(255,87,1,0.12), transparent);
  animation: scanline 5s ease-in-out infinite;
  z-index: 3;
  pointer-events: none;
}
@keyframes scanline {
  0%   { left: -10%; opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { left: 110%; opacity: 0; }
}
.carousel-wrap {
  overflow: hidden;
  position: relative;
}
/* Fade bordi */
.carousel-wrap::before,
.carousel-wrap::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 70px;
  z-index: 2;
  pointer-events: none;
}
.carousel-wrap::before { left: 0; background: linear-gradient(to right, var(--bg), transparent); }
.carousel-wrap::after  { right: 0; background: linear-gradient(to left, var(--bg), transparent); }
.carousel-track {
  display: flex;
  gap: 8px;
  width: max-content;
  animation: carousel-scroll 45s linear infinite;
  padding: 0 4px;
}
.carousel-track:hover { animation-play-state: paused; }
@keyframes carousel-scroll {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.carousel-slide {
  flex-shrink: 0;
  width: 195px;
  aspect-ratio: 3 / 2;
  border-radius: 5px;
  overflow: hidden;
  border: 1px solid rgba(255,87,1,0.3);
  box-shadow: 0 0 14px rgba(255,87,1,0.12), inset 0 0 0 1px rgba(255,255,255,0.04);
}
.carousel-slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 30%;
  display: block;
  filter: brightness(0.88) contrast(1.08) saturate(0.95);
  transition: filter 0.4s;
}
.carousel-slide { cursor: zoom-in; }
.carousel-slide:hover img { filter: brightness(1.05) contrast(1.05) saturate(1.1); }

/* ── Lightbox ── */
.lightbox {
  display: none;
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.92);
  align-items: center; justify-content: center;
  animation: lb-in .2s ease;
}
.lightbox.open { display: flex; }
@keyframes lb-in { from { opacity: 0; } to { opacity: 1; } }
.lightbox img {
  max-width: 94vw; max-height: 88vh;
  object-fit: contain;
  border-radius: 6px;
  box-shadow: 0 0 60px rgba(255,87,1,0.25);
  animation: lb-zoom .25s cubic-bezier(.2,.8,.3,1);
}
@keyframes lb-zoom { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.lightbox-close {
  position: absolute; top: 18px; right: 18px;
  background: var(--accent); border: none; cursor: pointer;
  color: #fff; font-family: 'Tusker Grotesk', sans-serif;
  font-size: 14px; font-weight: 700; letter-spacing: 1.5px;
  padding: 8px 18px; border-radius: 20px;
  text-transform: uppercase;
}

/* ── Footer ── */
footer {

  color: #666;

  font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
  text-align: center; line-height: 1.8;
  flex-shrink: 0;
}
footer strong { color: var(--accent); }
</style>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">✕ &nbsp;Chiudi</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightbox-img').src = src;
  lb.classList.add('open');
}
function closeLightbox() {
  const lb = document.getElementById('lightbox');
  lb.classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.getElementById('lightbox').addEventListener('click', function(e) {
  if (e.target === this) closeLightbox();
});
document.querySelectorAll('.carousel-slide img').forEach(img => {
  img.addEventListener('click', function() {
    openLightbox(this.src);
  });
});
// Chiudi con Escape
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
</script>
