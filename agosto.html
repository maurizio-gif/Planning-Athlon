<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orario Agosto 2026 — Athlon Club</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --accent: #ff5701; --black: #111111; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body { font-family: 'Barlow Condensed', sans-serif; background: var(--black); color:#fff; display:flex; flex-direction:column; }

/* Header */
.site-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid #1e1e1e;
  flex-shrink: 0;
}
.logo-img { height: 38px; width: auto; display: block; }
.back-btn {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
  color: #fff; text-decoration: none;
  background: #1e1e1e; border: 1px solid #333;
  padding: 7px 14px; border-radius: 20px;
  white-space: nowrap;
}
.back-btn:hover { background: #2a2a2a; }

/* Content */
.content {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px; text-align: center;
}
.eyebrow { font-size:11px; font-weight:800; letter-spacing:3px; text-transform:uppercase; color:#444; margin-bottom:14px; }
.title { font-size:clamp(34px,9vw,60px); font-weight:900; letter-spacing:2px; text-transform:uppercase; line-height:0.95; }
.title span { color: #1a72d4; }
.note { font-size:14px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:#555; margin-top:18px; }
</style>
</head>
<body>

<header class="site-header">
  <img src="https://www.athlonroma.it/wp-content/uploads/2025/08/Logo-oriz-full-2.png" alt="Athlon Club" class="logo-img">
  <a href="index.html" class="back-btn">← Indietro</a>
</header>

<div class="content">
  <div class="eyebrow">Orario estivo</div>
  <div class="title">Agosto<br><span>2026</span></div>
  <div class="note">Pagina in aggiornamento</div>
</div>

</body>
</html>
